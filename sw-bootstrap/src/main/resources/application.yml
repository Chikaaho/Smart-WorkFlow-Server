# ===================================================================
# Smart-WorkFlow 主配置文件
# ===================================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-workflow

  profiles:
    active: dev

  # ======================== 多数据源（dynamic-datasource，主库 = master） ========================
  datasource:
    dynamic:
      primary: master
      # FLyway 只跑主库；动态数据源自带的 Flyway 集成关闭，统一由 FlywayConfiguration 管控
      flyway:
        enabled: false
      # Druid 连接池全局配置
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
      datasource:
        master:
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://localhost:5432/smart_workflow
          username: ${DATASOURCE_USERNAME:postgres}
          password: ${DATASOURCE_PASSWORD:}
        # 扩展库示例（按需取消注释并补齐连接信息）：
        # iot:
        #   driver-class-name: org.postgresql.Driver
        #   url: jdbc:postgresql://localhost:5432/smart_workflow_iot
        #   username: ${DATASOURCE_USERNAME:postgres}
        #   password: ${DATASOURCE_PASSWORD:}

  # ======================== Druid 监控页面 ========================
  druid:
    stat-view-servlet:
      enabled: true
      url-pattern: /druid/*
      login-username: ${DRUID_USERNAME:admin}
      login-password: ${DRUID_PASSWORD:admin}

  # ======================== Flyway（主迁移，绑定主数据源） ========================
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/{vendor}
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

  # ======================== Redis ========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5000

  # ======================== Flowable ========================
  flowable:
    async-executor-activate: false
    database-schema-update: true

  # ======================== Spring AI ========================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3

  # ======================== MQTT ========================
  mqtt:
    broker:
      url: tcp://localhost:1883
      client-id: smart-workflow-client
      username: ${MQTT_USERNAME:}
      password: ${MQTT_PASSWORD:}

  # ======================== MinIO ========================
  minio:
    url: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: smart-workflow

sw:
  # ---------- 多租户（列级隔离） ----------
  tenant:
    ignore-tables:
      - sys_menu                           # sys_menu 为全局表，无 tenant_id 列，需排除租户拦截器

  # ---------- 外部数据源执行引擎 ----------
  external-datasource:
    cipher-key: ${SW_CIPHER_KEY:}                                        # AES-256-GCM 密钥（Base64），pro 从环境变量注入
    pool:
      max-pool-size: 5
      min-idle: 0
      idle-timeout: 600000                                              # 10 min
      max-lifetime: 1800000                                             # 30 min
      connection-timeout: 10000                                         # 10 sec
    execution:
      max-rows: 1000
      query-timeout: 30                                                 # 秒

  # ---------- 安全 / JWT ----------
  security:
    token-header: Authorization
    token-prefix: "Bearer "
    permit-urls:
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /actuator/**
      - /auth/login
    jwt:
      secret: ${JWT_SECRET:smart-workflow-jwt-secret-CHANGE-ME-IN-PRODUCTION-please}
      expire-seconds: 7200

# ======================== MyBatis-Plus ========================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.sw.ck.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ======================== 日志 ========================
logging:
  level:
    root: info
    com.sw.ck: debug

# ======================== Actuator ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# ======================== SpringDoc ========================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

